// Embed the imported assets in every build, including development clients.
// This local build input stays outside Git; import_tc4_resources.py regenerates it.
def bundledTc4Pack = layout.projectDirectory.file(providers.gradleProperty('tc4ResourcePack').getOrElse('tc4-local-resources.zip'))
def bundledLanguageDir = layout.buildDirectory.dir('generated/bundledLanguages')
def baseLanguageFiles = files('src/main/resources/assets/tc4modern/lang', providers.gradleProperty('tc4PortResources').getOrElse('related/thaumcraft4-reference/ported-resources') + '/assets/tc4modern/lang')
def mergeBundledLanguages = tasks.register('mergeBundledLanguages') {
    inputs.file(bundledTc4Pack)
    inputs.files(baseLanguageFiles)
    outputs.dir(bundledLanguageDir)
    doLast {
        def output = bundledLanguageDir.get().asFile
        def zip = new java.util.zip.ZipFile(bundledTc4Pack.asFile)
        try {
            ['en_us', 'ru_ru'].each { lang ->
                def merged = [:]
                baseLanguageFiles.files.each { dir ->
                    def file = new File(dir, lang + '.json')
                    if (file.exists()) merged.putAll(new groovy.json.JsonSlurper().parse(file))
                }
                merged.putAll(new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('assets/tc4modern/lang/' + lang + '.json'))))
                def target = new File(output, 'assets/tc4modern/lang/' + lang + '.json')
                target.parentFile.mkdirs()
                target.text = groovy.json.JsonOutput.toJson(merged)
            }
        } finally { zip.close() }
    }
}
tasks.named('processResources', ProcessResources).configure {
    from(zipTree(bundledTc4Pack)) {
        include 'assets/**'
        exclude 'assets/tc4modern/lang/en_us.json', 'assets/tc4modern/lang/ru_ru.json'
        // stray "name - copy.png" duplicates in the pack: invalid resource paths (spaces) that Minecraft logs as errors
        exclude '**/* - copy.*'
        // The imported pack previously had top priority over these few base models/lang files.
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    // Issue #4: the modern villager profession layers reuse the original wizard and moneychanger skins.
    ['villager', 'zombie_villager'].each { kind ->
        from(zipTree(bundledTc4Pack)) {
            include 'assets/tc4modern/textures/models/wizard.png', 'assets/tc4modern/textures/models/moneychanger.png'
            eachFile { it.path = "assets/tc4modern/textures/entity/${kind}/profession/" + (it.name == 'wizard.png' ? 'wizard.png' : 'banker.png') }
            includeEmptyDirs = false
        }
    }
    from(mergeBundledLanguages) { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}

