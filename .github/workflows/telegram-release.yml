name: Telegram release announcement

on:
  workflow_dispatch:
    inputs:
      message:
        description: Full announcement text
        required: true
        type: string
      confirm:
        description: Publish this message to Telegram
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post announcement to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: ${{ inputs.message }}
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          message = os.environ.get("TELEGRAM_MESSAGE", "")
          if not message.strip() or len(message) > 4096:
              raise SystemExit("Announcement text must contain 1 to 4096 characters.")

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repository secrets.")

          payload = {
              "chat_id": chat_id,
              "text": message,
              "link_preview_options": {"is_disabled": True},
          }
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit("Telegram rejected the message (HTTP " + str(error.code) + ").") from None
          except urllib.error.URLError:
              raise SystemExit("Could not connect to Telegram.") from None
          if not result.get("ok"):
              raise SystemExit("Telegram did not confirm message delivery.")
          print("Release announcement sent.")
